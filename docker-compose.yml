services:
  redis:
    image: redis:latest
    container_name: atlas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  agent:
    build: .
    container_name: atlas-agent
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: atlas-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
